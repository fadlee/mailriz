name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web
        run: bun run --cwd packages/app/web build

      - name: Test (sanitizer)
        run: |
          cd packages/app
          bun test test/sanitize.test.ts

      - name: Test (email handler)
        run: |
          cd packages/app
          bun test test/email-handler.test.ts
