name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web
        run: bun run --cwd packages/app/web build

      - name: Test (sanitizer)
        # Separate steps: postal-mime keeps the event loop alive, which makes a
        # combined or chained `bun test` hang after completion.
        run: bun run --cwd packages/app test test/sanitize.test.ts

      - name: Test (email handler)
        run: bun run --cwd packages/app test test/email-handler.test.ts
