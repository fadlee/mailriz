name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web
        run: bun run --cwd packages/app/web build

      - name: Test (sanitizer)
        # bun test 1.3.x hangs after completion on GitHub runners; the wrapper
        # force-exits once results are printed (see scripts/ci-test.sh).
        run: |
          cd packages/app
          bash ../../scripts/ci-test.sh test/sanitize.test.ts

      - name: Test (email handler)
        run: |
          cd packages/app
          bash ../../scripts/ci-test.sh test/email-handler.test.ts
