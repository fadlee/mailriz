name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run --cwd packages/app/web build

      - name: Bundle worker (wrangler dry-run)
        run: |
          cd packages/app
          bunx wrangler deploy --dry-run --outdir ../../.release/worker
          cp -r migrations ../../.release/worker/migrations
          # Ship the built dashboard as static assets for the CLI deploy
          # (web/dist contains index.html + assets/ — copy contents so index.html
          #  sits at the assets root, matching assets.directory = ./assets)
          mkdir -p ../../.release/worker/assets
          cp -r web/dist/. ../../.release/worker/assets/
          ls -la ../../.release/worker
          ls -la ../../.release/worker/assets

      - name: Create release tarball
        run: |
          cd .release
          tar -czf ../mailriz-worker.tar.gz worker
          ls -la ../mailriz-worker.tar.gz

      - name: Build CLI
        run: bun run --cwd packages/cli build

      # The tag is the single source of truth for the published version, so a
      # release is just "push a tag" — package.json's version is a placeholder.
      # We also strip the bun `workspace:*` devDep: npm can't parse that protocol
      # (EUNSUPPORTEDPROTOCOL) and the shared code is already bundled into
      # dist/cli.js, so the published manifest doesn't need it.
      - name: Set CLI version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a semver version (expected vX.Y.Z)" >&2
            exit 1
          fi
          cd packages/cli
          npm pkg set version="$VERSION"
          npm pkg delete devDependencies.@mailriz/shared
          echo "Publishing mailriz-cli@$VERSION"

      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set — add it with: gh secret set NPM_TOKEN" >&2
            exit 1
          fi
          cd packages/cli
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm publish --access public

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mailriz-worker.tar.gz
          generate_release_notes: true
