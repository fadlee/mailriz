name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # Required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.21

      # Trusted publishing needs npm CLI >= 11.5.1 + Node >= 22.14.
      # setup-node gives us a recent npm; bun stays for the build.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run --cwd packages/app/web build

      - name: Bundle worker (wrangler dry-run)
        run: |
          cd packages/app
          bunx wrangler deploy --dry-run --outdir ../../.release/worker
          cp -r migrations ../../.release/worker/migrations
          # Ship the built dashboard as static assets for the CLI deploy
          # (web/dist contains index.html + assets/ — copy contents so index.html
          #  sits at the assets root, matching assets.directory = ./assets)
          mkdir -p ../../.release/worker/assets
          cp -r web/dist/. ../../.release/worker/assets/
          ls -la ../../.release/worker
          ls -la ../../.release/worker/assets

      - name: Create release tarball
        run: |
          cd .release
          tar -czf ../mailriz-worker.tar.gz worker
          ls -la ../mailriz-worker.tar.gz

      - name: Build CLI
        run: bun run --cwd packages/cli build

      # The tag is the single source of truth for the published version, so a
      # release is just "push a tag" — package.json's version is a placeholder.
      # We also strip the bun `workspace:*` devDep: npm can't parse that protocol
      # (EUNSUPPORTEDPROTOCOL) and the shared code is already bundled into
      # dist/cli.js, so the published manifest doesn't need it.
      - name: Set CLI version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a semver version (expected vX.Y.Z)" >&2
            exit 1
          fi
          cd packages/cli
          npm pkg set version="$VERSION"
          npm pkg delete devDependencies.@mailriz/shared
          echo "Publishing mailriz-cli@$VERSION"

      # Publish from a temp copy outside the repo: npm refuses to publish a
      # workspace member (ENOWORKSPACES) whenever the repo root declares
      # `workspaces`, regardless of --workspaces=false.
      #
      # Auth: npm CLI auto-detects the GitHub OIDC environment and exchanges it
      # for a short-lived npm token (trusted publishing). Until the trusted
      # publisher is configured on npmjs.com, it falls back to NODE_AUTH_TOKEN
      # (an Automation token — automation tokens bypass the 2FA OTP prompt).
      - name: Publish CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TMP_PKG="$(mktemp -d)"
          cp -r packages/cli/. "$TMP_PKG/"
          cd "$TMP_PKG"
          # npm does not read NODE_AUTH_TOKEN directly — write it to .npmrc
          # (setup-node normally does this when registry-url is given).
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          # --provenance attaches a signed attestation tying this tarball to
          # this workflow run and commit, which anyone can verify with
          # `npm audit signatures`. Needs the id-token permission above.
          npm publish --access public --provenance

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: mailriz-worker.tar.gz
          generate_release_notes: true
